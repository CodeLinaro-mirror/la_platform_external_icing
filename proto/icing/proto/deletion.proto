syntax = "proto2";

package icing.lib;

option java_package = "com.google.android.icing.proto";
option java_multiple_files = true;
option objc_class_prefix = "ICNG";

// A DeletionEvent records that a document was deleted. DeletionEvents are
// meant to be used by icing internally and are stored in the DeletionLog so
// that document deletions can later be retrieved (e.g. by offline observers).
// Next tag: 6
message DeletionEvent {
  // The namespace of the deleted document.
  optional string name_space = 1;

  // The uri of the deleted document.
  optional string uri = 2;

  // The schema type of the deleted document.
  optional string schema = 3;

  // The time, in milliseconds since epoch, at which the document was deleted.
  optional int64 deletion_timestamp_ms = 4;

  // The time, in milliseconds since epoch, at which the deleted document was
  // last created or updated. Used to filter out deletions of documents that a
  // client has never seen.
  optional int64 last_update_timestamp_ms = 5;
}
